[package]
name = "find-my-phone"
version = "1.0.0"
description = "Find My Phone - Bluetooth RSSI Tracker for Windows"
authors = ["Find My Phone Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Windows Bluetooth dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Security",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Radios",
    "Storage_Streams",
    "Foundation_Collections",
]}
btleplug = "0.11"
